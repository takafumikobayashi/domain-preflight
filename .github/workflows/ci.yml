name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Tests use fakes only; they never reach the network.
      - run: npm test
      - run: npm run build
      # The plugin ships a bundled CLI; fail if it was not rebuilt after changes to src/.
      - run: npm run bundle && git diff --exit-code -- plugin/lib
